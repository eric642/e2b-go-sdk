name: test

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true
      - name: Verify modules
        run: |
          go mod verify
          go mod tidy -diff
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l *.go template volume internal/transport scripts examples)"
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet -mod=readonly ./...
      - name: Vet (windows/amd64)
        run: GOOS=windows GOARCH=amd64 go vet -mod=readonly ./...
      - name: Test
        run: go test -mod=readonly -race -shuffle=on -count=1 -cover ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true
      # The official golangci-lint release binaries are built with an older
      # Go toolchain than our go.mod (1.26), so they refuse to load our
      # package graph. Build from source on the runner instead so the
      # lint binary uses the same Go version we target.
      - name: Install golangci-lint from source
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      - name: Lint
        run: golangci-lint run --timeout=5m
      - name: Lint (integration build tag)
        run: golangci-lint run --build-tags=integration --timeout=5m
