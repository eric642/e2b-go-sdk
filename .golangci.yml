version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - govet
    - ineffassign
    - nilerr
    - nolintlint
    - staticcheck
    - thelper
    - unconvert
    - unused

  exclusions:
    # Generated clients live under specific internal/ subdirectories; internal/transport/
    # and scripts/ are hand-written and remain actively linted. Upstream submodules are excluded.
    paths:
      - ^internal/api/
      - ^internal/envd/
      - ^internal/envdapi/
      - ^internal/volumeapi/
      - ^internal/version/
      - ^E2B/
      - ^runtime/

  settings:
    errcheck:
      exclude-functions:
        - (*os.File).Close
        - (io.Closer).Close
    nolintlint:
      require-specific: true
      require-explanation: true
    staticcheck:
      checks:
        - all
        - -ST1000
