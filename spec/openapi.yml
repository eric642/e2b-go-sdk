      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewSecret"
      responses:
        "201":
          description: Successfully created the secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Secret"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          $ref: "#/components/responses/404"
        "409":
          description: >-
            Secret name conflict or project live-secret limit reached. A quota
            response has error_code secret_limit_reached and, when reported by
            the backend, the effective cap in message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                secretLimitReached:
                  value:
                    code: 409
                    message: Project has reached its limit of 50 live secrets
                    error_code: secret_limit_reached
        "429":
          $ref: "#/components/responses/429"
        "500":
          $ref: "#/components/responses/500"
        "502":
          $ref: "#/components/responses/502"
        "504":
          $ref: "#/components/responses/504"

